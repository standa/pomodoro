# Push a tag like v1.0.0 to test, build and publish a GitHub release with Pomodoro-v1.0.0.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test and build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/Pomodoro.app "Pomodoro-$GITHUB_REF_NAME.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Pomodoro-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
